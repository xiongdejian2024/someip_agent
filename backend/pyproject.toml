[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "someip-agent-core"
version = "0.1.1"
description = "企业级 SOME/IP 仿真、监控与智能体后端"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SOME/IP Agent Team" }]
dependencies = [
  "cryptography>=43,<47",
  "dpkt>=1.9.8,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "lxml>=5,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
]
packaging = ["pyinstaller>=6.11,<7"]

[project.scripts]
someip-agent = "someip_agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/someip_agent", "src/soa_partner"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"] # FastAPI 官方依赖注入模式需要在参数默认值调用 Depends/File/Query

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dpkt", "lxml", "lxml.*"]
ignore_missing_imports = true
