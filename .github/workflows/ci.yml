name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: vsomeip 原生与虚拟以太网验收
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 构建固定版本原生镜像
        run: make native-image
      - name: 编解码与虚拟网功能验收
        run: make native-test
      - name: 原生后端完整回归
        run: make native-regression
      - name: 不挂载源码的安装包虚拟网与后端验收
        run: make native-installed-test
      - name: 保留抓包、日志和测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsomeip-virtual-evidence
          path: build/virtual-evidence/
          if-no-files-found: error
      - name: 保留安装包验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsomeip-installed-evidence
          path: build/installed-evidence/
          if-no-files-found: error

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 校验语义版本
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/check_version.py
          fi

      - name: 安装后端开发依赖
        run: python -m pip install -e './backend[dev]'

      - name: 静态检查
        run: >-
          python -m ruff check backend/src backend/tests
          scripts/check_version.py scripts/create_update_manifest.py
          native/tests/audit_pcap.py native/tests/audit_offline.py native/tests/test_audit_pcap.py
          native/tests/test_evidence_permissions.py native/tests/test_recovery_virtual.py
          native/tests/test_sat_wti_virtual.py

      - name: 执行后端测试
        run: python -m pytest backend/tests --cov=someip_agent --cov-report=term-missing

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: 类型检查
        run: npm --prefix frontend run typecheck

      - name: 服务与抓包来源适配器验收
        run: node scripts/check_service_adapters.mjs

      - name: 构建前端
        run: npm --prefix frontend run build

  windows-package:
    name: Windows 安装包
    needs: [backend-test, frontend-build, native-runtime]
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: 构建原生协议栈与桥接进程
        shell: powershell
        run: .\packaging\windows\build-native.ps1

      - name: 构建 Windows 安装包
        shell: powershell
        run: .\packaging\windows\build.ps1 -Clean

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: someip-agent-windows-${{ github.run_number }}
          path: packaging/windows/output/*
          if-no-files-found: error
          retention-days: 14
