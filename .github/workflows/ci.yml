name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "手动执行暂缓的 Windows 安装包构建（需要授权 SDK）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: vsomeip 原生与虚拟以太网验收
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 构建固定版本原生镜像
        run: make native-image
      - name: 编解码与虚拟网功能验收
        run: make native-test
      - name: 原生后端完整回归
        run: make native-regression
      - name: 不挂载源码的安装包虚拟网与后端验收
        run: make native-installed-test
      - name: 安装包短负载与逐序号线上核验
        run: make native-performance
      - name: 配置 Linux 发行包的前端构建环境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建 Linux 完整发行包
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          make package-linux
      - name: 隔离验收真实签名升级与失败回滚
        run: make linux-update-test
      - name: 无 Python 和 SDK 的干净发行包验收
        run: make linux-clean-test
      - name: 保存发行包、完整堆栈与升级证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-update-evidence
          path: |
            build/linux-update-evidence/
            build/linux-clean-evidence/
          if-no-files-found: error
      - name: 保留抓包、日志和测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsomeip-virtual-evidence
          path: build/virtual-evidence/
          if-no-files-found: error
      - name: 保留安装包验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsomeip-installed-evidence
          path: build/installed-evidence/
          if-no-files-found: error
      - name: 保留性能采样、逐序号审计和抓包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsomeip-performance-evidence
          path: build/performance-evidence/
          if-no-files-found: error

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 校验语义版本
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python scripts/check_version.py
          fi

      - name: 安装后端开发依赖
        run: python -m pip install -e './backend[dev]'

      - name: 静态检查
        run: >-
          python -m ruff check backend/src backend/tests
          scripts/check_version.py scripts/create_update_manifest.py
          packaging/linux
          native/tests/audit_pcap.py native/tests/audit_offline.py native/tests/test_audit_pcap.py
          native/tests/audit_ipv4_options.py
          native/tests/test_evidence_permissions.py native/tests/test_recovery_virtual.py
          native/tests/test_sat_wti_virtual.py
          native/tests/test_arxml_composite_virtual.py
          native/tests/test_large_array_virtual.py native/tests/benchmark_member_ipc.py
          native/tests/test_ipv4_options_virtual.py native/tests/ipv4_options_sender.py
          native/tests/ipv4_option_vectors.py
          native/tests/benchmark_virtual.py native/tests/performance_metrics.py
          native/tests/test_performance_metrics.py
          native/tests/audit_service_names.py native/tests/test_service_names.py

      - name: 统计与源服务名称审计回归
        run: python -m pytest native/tests/test_performance_metrics.py native/tests/test_service_names.py

      - name: 执行后端测试
        run: python -m pytest backend/tests --cov=someip_agent --cov-report=term-missing

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: 类型检查
        run: npm --prefix frontend run typecheck

      - name: 服务与抓包来源适配器验收
        run: node scripts/check_service_adapters.mjs

      - name: 设置页发行目标与缺省升级门禁渲染验收
        run: node scripts/check_settings_render.mjs

      - name: 构建前端
        run: npm --prefix frontend run build

  windows-package:
    name: Windows 安装包
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    needs: [backend-test, frontend-build, native-runtime]
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 校验中文 PowerShell 脚本语法
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows -Filter *.ps1 | ForEach-Object {
            $Tokens = $null
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors) | Out-Null
            if ($ParseErrors.Count -gt 0) {
              $ParseErrors | ForEach-Object { [Console]::Error.WriteLine($_.ToString()) }
              throw "Windows 构建脚本语法校验失败"
            }
            Write-Host "脚本语法校验通过：$($_.Name)"
          }

      - name: 构建原生协议栈与桥接进程
        shell: pwsh
        run: .\packaging\windows\build-native.ps1

      - name: 构建 Windows 安装包
        shell: pwsh
        run: .\packaging\windows\build.ps1 -Clean

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: someip-agent-windows-${{ github.run_number }}
          path: packaging/windows/output/*
          if-no-files-found: error
          retention-days: 14
